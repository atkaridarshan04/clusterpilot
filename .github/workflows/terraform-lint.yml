name: terraform lint

on:
  pull_request:
    paths:
      - "terraform/**"
      - "!terraform/**/*.md"
  push:
    paths:
      - "terraform/**"
      - "!terraform/**/*.md"
  workflow_dispatch: {}

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.0"

      - run: terraform fmt -check -recursive

      # -backend=false: no AWS credentials needed, syntax checks only.
      - run: terraform init -backend=false

      - run: terraform validate

  tflint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - run: tflint --recursive

  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the repo's code scanning
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install checkov==3.3.10

      # `if: always()` specifically to still upload it in that case.
      - run: checkov -d . --output cli --output sarif --output-file-path console,checkov-results.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: terraform/checkov-results.sarif
